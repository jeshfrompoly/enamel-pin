<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3840 2160"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Layered baseball enamel pin artwork</title>
  <desc id="desc">Three flat-color regions prepared as independent layers: white base, navy enamel, and red enamel.</desc>

  <!--
    Geometry contract for the renderer:
    - Every direct child group is one material/color layer.
    - data-enamel-role="base" is the full pin silhouette/backing.
    - data-enamel-role="fill" groups are enamel inlays rendered above the base.
    - The navy path uses even-odd fill so the ball remains an exposed white inset.
  -->
  <g id="white-base"
     data-enamel-role="base"
     data-enamel-color="#FFFFFF"
     fill="#FFFFFF">
    <rect x="28" y="65" width="3784" height="2033" rx="290" ry="290"/>
  </g>

  <g id="navy-enamel"
